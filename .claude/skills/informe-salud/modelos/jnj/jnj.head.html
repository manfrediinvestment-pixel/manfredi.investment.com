  body{margin:0; background:#fff; color:var(--text); font-family:var(--sans); font-size:15.5px; line-height:1.7;}

  .govcell .k{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px;}
  .govcell .v{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--text);}
  .govcell .sub{font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.4;}

  a{color:var(--blue);}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

    .toc ol{columns:1;}

    .govcell{border-right:none;}

  .brand-mark{border:0 !important; width:38px !important; height:38px !important; display:block !important; padding:0 !important;}
  .brand-mark img{width:38px; height:38px; display:block; border-radius:9px;}
  .secnum{color:#3d6ea8 !important;}
  .verdict-note{color:var(--muted) !important;}
  .thesis-block{font-style:normal !important;}
  .toc a{display:inline-block; padding:5px 0;}
  @media (max-width:560px){ .site-back{padding:10px 18px 0;} .site-back a:last-child{display:none;} .brandbar{flex-wrap:wrap; gap:12px;} .brandbar .doctype{text-align:left; width:100%;} }
