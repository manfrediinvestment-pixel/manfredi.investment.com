name: Reportes Diarios

on:
  schedule:
        - cron: '0 11 * * *'  # Todos los dias 8:00 AM ART (11:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el catálogo de informes usa la fecha del primer commit de cada uno

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate Reports
        run: python update_reports.py

      # Fondos comunes (CAFCI) para la pestaña "Fondos comunes" de Mercados.
      # La skill cafci usa sintaxis de Python 3.10+, por eso su propio Python.
      # Si CAFCI falla, se sigue con el fci.json del día anterior.
      - name: Setup Python 3.11 (fondos)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate FCI
        continue-on-error: true
        run: |
          pip install requests openpyxl
          python scripts/build_fci.py

      # Catálogo de la pestaña Informes (trimestre, secciones, cifras de la tapa y fecha
      # de cada informe): así la estantería suma sola los informes nuevos.
      - name: Generate catálogo de informes
        continue-on-error: true
        run: node scripts/catalogo-informes.mjs

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/*.json informes/catalogo.json
          git commit -m "Update daily reports [skip ci]" || echo "No changes to commit"
          git push

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=manfredinvestment-com --branch=main
