  <script>
    (function () {
      const MF = window.MF, { clamp, eOut4, eInOut3 } = MF;
      const R = document.querySelector('[data-composition-id="obra"]');
      const $ = (s) => R.querySelector(s);
      const sR = MF.odo($("#o-rpoN"), ["US$ ", 100000, 10000, 1000, ".", 100, 10, 1, "~M"]);
      const people = [1, 2, 3, 4, 5, 6, 7].map((i) => $("#o-p" + i));
      const tl = gsap.timeline({ paused: true });
      MF.clock(tl, 12.0, (t) => {
        sR(300000 + 377000 * eInOut3(clamp((t - 4.5) / 1.4, 0, 1)));
        // la fila de interesados camina hacia la obra, rebotando al paso
        people.forEach((p, i) => {
          const u = eOut4(clamp((t - 7.0 - i * 0.12) / 1.1, 0, 1));
          const x = 1180 + i * 60 + (700 + i * 38 - (1180 + i * 60)) * u;
          const bob = u < 1 ? Math.abs(Math.sin(t * 16 + i)) * 10 : Math.abs(Math.sin(t * 5 + i * 1.3)) * 4;
          p.style.transform = `translate(${x}px, ${-bob}px)`;
        });
      });
      MF.captions(tl, R, [["#o-h1", 0.04, 1.7], ["#o-h2", 1.7, 3.2], ["#o-h3", 3.2, 4.4], ["#o-h4", 4.4, 5.9], ["#o-h5", 5.9, 7.0], ["#o-h6", 7.0, 8.4], ["#o-h7", 8.4, 9.8], ["#o-h8", 9.8, 11.6]]);

      // la grúa sube desde abajo y la pluma se despliega
      tl.fromTo("#o-tower", { y: 900 }, { y: 0, duration: 0.6, ease: "expo.out" }, 0.1);
      tl.fromTo("#o-jib", { x: 1000, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.45);
      tl.fromTo("#o-ground", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.15);
      tl.fromTo("#o-dirt", { opacity: 0 }, { opacity: 0.5, duration: 0.4 }, 0.3);
      tl.fromTo(["#o-trolley", "#o-rig"], { x: 800, opacity: 0 }, { x: 800, opacity: 1, duration: 0.2 }, 0.8);
      tl.set("#o-load", { opacity: 0 }, 0);
      tl.to(["#o-trolley", "#o-rig"], { x: 350, duration: 0.9, ease: "power3.inOut" }, 1.0);

      // vendió antes de levantar: aparecen los contornos y los carteles de VENDIDO se balancean
      [0, 1, 2, 3, 4, 5].forEach((i) => {
        tl.fromTo("#o-g" + i, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.7 + i * 0.08);
        tl.fromTo("#o-t" + i, { opacity: 0, scale: 0.2, rotation: 0 }, { opacity: 1, scale: 1, rotation: 18, duration: 0.22, ease: "back.out(3)" }, 2.2 + i * 0.16);
        tl.to("#o-t" + i, { rotation: 0, duration: 1.2, ease: "elastic.out(1, 0.25)" }, 2.42 + i * 0.16);
      });
      // levantarlos: los pisos caen uno sobre otro con aplaste y rebote
      tl.to("#o-cable", { height: 140, duration: 0.3, ease: "power2.out" }, 3.2);
      tl.to("#o-cable", { height: 60, duration: 0.5, ease: "power2.inOut" }, 4.4);
      [0, 1, 2, 3, 4, 5].forEach((i) => {
        const at = 3.2 + i * 0.2;
        tl.fromTo("#o-f" + i, { y: -1300, opacity: 1, filter: "blur(12px)" }, { y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.in" }, at);
        tl.to("#o-f" + i, { scaleY: 0.86, duration: 0.05, ease: "power2.out", transformOrigin: "50% 100%" }, at + 0.3);
        tl.to("#o-f" + i, { scaleY: 1, duration: 0.3, ease: "elastic.out(1, 0.45)" }, at + 0.35);
        tl.set("#o-f" + i, { attr: { class: "fl solid lit" } }, 6.0 + i * 0.12);
      });
      MF.shake(tl, "#o-shake", 4.5, 8);

      // 677 mil millones en contratos firmados
      tl.fromTo("#o-rpo", { y: 700, filter: "blur(12px)" }, { y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 4.35);
      tl.to("#o-rpoN", { scale: 1.08, duration: 0.07, ease: "power2.out", transformOrigin: "right center" }, 5.9);
      tl.to("#o-rpoN", { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 5.97);
      tl.fromTo("#o-rpo .badge", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, 6.05);
      tl.fromTo("#o-src", { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, 4.6);

      // le sobran interesados (la fila camina en el reloj) + globo
      tl.fromTo("#o-want", { opacity: 0, scale: 0.3, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(3)" }, 7.7);
      tl.to("#o-want", { opacity: 0, y: -30, duration: 0.25, ease: "power3.in" }, 8.4);

      // pide un crédito: el gancho trae el cartel y queda colgando, balanceándose
      tl.to(["#o-trolley", "#o-rig"], { x: 812, duration: 0.7, ease: "power3.inOut" }, 7.2);
      tl.fromTo("#o-load", { opacity: 0, y: -600 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.in", immediateRender: false }, 8.45);
      tl.to("#o-cable", { height: 260, duration: 0.55, ease: "power3.inOut" }, 8.85);
      tl.fromTo("#o-rig", { rotation: 0 }, { rotation: 9, duration: 0.25, ease: "power2.out", immediateRender: false }, 9.35);
      tl.to("#o-rig", { rotation: 0, duration: 1.6, ease: "elastic.out(1, 0.22)" }, 9.6);
      MF.flash(tl, "#o-flash", 9.35);

      // para hacer más pisos: tres pisos nuevos caen arriba del edificio, con cartel NUEVO
      [6, 7, 8].forEach((i, k) => {
        const at = 9.95 + k * 0.32;
        tl.fromTo("#o-f" + i, { y: -900, opacity: 0, filter: "blur(12px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.in" }, at);
        tl.to("#o-f" + i, { scaleY: 0.86, duration: 0.05, ease: "power2.out", transformOrigin: "50% 100%" }, at + 0.32);
        tl.to("#o-f" + i, { scaleY: 1, duration: 0.3, ease: "elastic.out(1, 0.45)" }, at + 0.37);
        tl.fromTo("#o-t" + i, { opacity: 0, scale: 0.2, rotation: 0 }, { opacity: 1, scale: 1, rotation: 20, duration: 0.2, ease: "back.out(3)" }, at + 0.34);
        tl.to("#o-t" + i, { rotation: 0, duration: 1.1, ease: "elastic.out(1, 0.25)" }, at + 0.54);
        MF.shake(tl, "#o-shake", at + 0.32, 6);
      });
      window.__timelines["obra"] = tl;
    })();
  </script>
