  <script>
    (function () {
      const MF = window.MF, { clamp, eOut4, eInOut3 } = MF;
      const R = document.querySelector('[data-composition-id="informe"]');
      const $ = (s) => R.querySelector(s);
      // cierres reales MSFT 21-sep → 3-nov-2026 (Yahoo Finance)
      const P = [501.61,498.0,500.59,497.93,516.17,509.22,508.96,512.9,512.8,517.53,525.18,529.3,529.76,522.61,535.07,541.15,543.45,533.69,539.44,529.05,533.52,531.87,532.95,521.08,524.51,532.6,531.33,531.01,530.14,521.91,507.12,520.99];
      const LOW = 30;
      const FV = 540.66, W = 940, H = 410, lo = 488, hi = 552;
      const X = (i) => (i / (P.length - 1)) * (W - 250);
      const Y = (p) => H - ((p - lo) / (hi - lo)) * H;
      const fmt = (v) => v.toFixed(2).replace(".", ",");
      const sFV = MF.odo($("#f-fv"), ["US$ ", 100, 10, 1, ",", 0.1, 0.01]);
      const line = $("#f-line"), area = $("#f-area"), dot = $("#f-dot"), tag = $("#f-tag"), hit = $("#f-hit");
      const fvY = Y(FV);
      $("#f-fvline").setAttribute("y1", fvY); $("#f-fvline").setAttribute("y2", fvY);
      $("#f-fvlab").style.transform = `translate(0px, ${fvY - 36}px)`;
      hit.style.transform = `translate(${X(LOW)}px, ${Y(P[LOW])}px)`;
      function drawChart(prog) {
        const n = Math.floor(prog), f = prog - n;
        let d = "", px = 0, py = 0;
        for (let i = 0; i <= n && i < P.length; i++) { px = X(i); py = Y(P[i]); d += (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1); }
        let price = P[Math.min(n, P.length - 1)];
        if (n < P.length - 1 && f > 0) { price = P[n] + (P[n + 1] - P[n]) * f; px = X(n + f); py = Y(price); d += "L" + px.toFixed(1) + " " + py.toFixed(1); }
        line.setAttribute("d", d);
        area.setAttribute("d", d + `L${px.toFixed(1)} ${H} L0 ${H} Z`);
        dot.setAttribute("cx", px); dot.setAttribute("cy", py);
        tag.style.transform = `translate(${px + 22}px, ${py - 26}px)`;
        tag.textContent = "US$ " + fmt(price);
        tag.style.background = prog > LOW - 1.2 && prog < LOW + 0.6 ? "#EF4444" : "#12233b";
      }
      const tl = gsap.timeline({ paused: true });
      MF.clock(tl, 8.9, (t) => {
        sFV(400 + 140.66 * eOut4(clamp((t - 1.3) / 1.6, 0, 1)));
        // dibuja hasta el lunes 2-nov (507) mientras dice "el lunes tocó", y remata en el martes (521)
        const u1 = clamp((t - 3.7) / 1.9, 0, 1), u2 = clamp((t - 6.0) / 0.9, 0, 1);
        const prog = t < 6.0 ? LOW * eInOut3(u1) : LOW + eOut4(u2);
        drawChart(Math.max(0.0001, prog));
      });
      MF.captions(tl, R, [["#f-h1", 0.04, 1.2], ["#f-h2", 1.2, 2.4], ["#f-h3", 2.4, 3.9], ["#f-h4", 3.9, 5.6], ["#f-h5", 5.6, 8.0]]);

      tl.fromTo("#f-date", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0.8);
      tl.to("#f-fv", { scale: 1.06, duration: 0.07, ease: "power2.out", transformOrigin: "left center" }, 2.9);
      tl.to("#f-fv", { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 2.97);
      tl.fromTo("#f-fvline", { strokeDashoffset: 960, strokeDasharray: "14 10" }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 3.0);
      tl.fromTo("#f-fvline", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 3.0);
      tl.fromTo("#f-fvlab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.2);
      tl.fromTo(["#f-line", "#f-dot", "#f-tag", "#f-area"], { opacity: 0 }, { opacity: 1, duration: 0.15 }, 3.65);
      tl.fromTo("#f-axis", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.65);
      // el piso del lunes
      tl.fromTo("#f-hit", { opacity: 1, scale: 0.2 }, { opacity: 0, scale: 3.2, duration: 0.7, ease: "power2.out", immediateRender: false }, 5.6);
      // rebote del martes y la distancia a nuestro valor
      MF.flash(tl, "#f-flash", 6.9);
      tl.fromTo("#f-near", { opacity: 0, y: 30, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, 7.0);
      tl.fromTo("#f-src", { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, 1.0);
      window.__timelines["informe"] = tl;
    })();
  </script>
