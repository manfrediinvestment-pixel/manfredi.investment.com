  <script>
    (function () {
      const MF = window.MF, { clamp, eOut4, eInOut3 } = MF;
      const R = document.querySelector('[data-composition-id="golpe"]');
      const $ = (s) => R.querySelector(s);
      // 13-oct-2026: cierre previo, apertura, máximo, cierre (Yahoo Finance). Recorrido entre puntos: ilustrativo.
      const P = [334.30, 339.97, 344.36, 331.43];
      const BASE = 334.30, W = 900, H = 330, lo = 328, hi = 347;
      const X = (i) => 40 + (i / (P.length - 1)) * (W - 290);
      const Y = (p) => H - ((p - lo) / (hi - lo)) * H;
      const pct = (p) => { const v = (p / BASE - 1) * 100; return (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2).replace(".", ",") + "%"; };
      const setNum = MF.odo($("#g-num"), ["US$ ", 10000, 1000, ".", 100, 10, 1, "~M"]);
      const line = $("#g-line"), area = $("#g-area"), dot = $("#g-dot"), tag = $("#g-tag");
      R.querySelectorAll("#g-axis span").forEach((s, i) => (s.style.left = X(i) + "px"));
      $("#g-base").setAttribute("y1", Y(BASE)); $("#g-base").setAttribute("y2", Y(BASE));
      function drawChart(prog) {
        const n = Math.floor(prog), f = prog - n;
        let d = "", px = 0, py = 0;
        for (let i = 0; i <= n && i < P.length; i++) { px = X(i); py = Y(P[i]); d += (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1); }
        let price = P[Math.min(n, P.length - 1)];
        if (n < P.length - 1 && f > 0) { price = P[n] + (P[n + 1] - P[n]) * f; px = X(n + f); py = Y(price); d += "L" + px.toFixed(1) + " " + py.toFixed(1); }
        line.setAttribute("d", d);
        area.setAttribute("d", d + `L${px.toFixed(1)} ${Y(BASE)} L${X(0)} ${Y(BASE)} Z`);
        dot.setAttribute("cx", px); dot.setAttribute("cy", py);
        tag.style.transform = `translate(${px + 24}px, ${py - 28}px)`;
        tag.textContent = pct(price);
        const red = price < BASE;
        tag.style.background = red ? "#EF4444" : "#10B981";
        dot.setAttribute("fill", red ? "#EF4444" : "#10B981");
        area.style.opacity = clamp((prog - 2.6) / 0.4, 0, 1);
      }
      const tl = gsap.timeline({ paused: true });
      MF.clock(tl, 4.8, (t) => {
        setNum(15000 + (15310 - 15000) * eOut4(clamp(t / 1.5, 0, 1)));
        let prog;
        if (t < 2.0) prog = 2 * eInOut3(clamp((t - 0.35) / 1.65, 0, 1));
        else prog = 2 + eOut4(clamp((t - 2.15) / 0.75, 0, 1));
        drawChart(Math.max(0.0001, prog));
      });
      MF.karaoke(tl, R, "#g-h1", -0.04, 1.9, 0.3, true);
      MF.karaoke(tl, R, "#g-h2", 1.96, null, 0.26);
      tl.fromTo("#g-num", { scale: 1 }, { scale: 1.07, duration: 0.08, ease: "power2.out" }, 1.45);
      tl.to("#g-num", { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.53);
      // el número verde se apaga cuando la acción se da vuelta
      tl.to("#g-num", { color: "#f6f8fc", filter: "drop-shadow(0 0 0px rgba(0,0,0,0))", duration: 0.4 }, 2.6);
      tl.fromTo("#g-axis span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", stagger: 0.25 }, 0.3);
      // la placa del banco cae y pega; no se rompe, se hunde
      tl.fromTo("#g-platewrap", { y: -1800, rotation: -6, filter: "blur(14px)" }, { y: 0, rotation: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.in" }, 2.48);
      tl.fromTo("#g-platewrap", { scaleY: 1, scaleX: 1 }, { scaleY: 0.88, scaleX: 1.07, duration: 0.06, ease: "power2.out", immediateRender: false }, 2.9);
      tl.to("#g-platewrap", { scaleY: 1, scaleX: 1, duration: 0.45, ease: "elastic.out(1, 0.45)" }, 2.96);
      tl.to("#g-platewrap", { rotation: 4, y: 26, duration: 0.5, ease: "power2.out" }, 3.0);
      MF.flash(tl, "#g-flash", 2.9);
      MF.shake(tl, "#g-shake", 2.9, 14);
      tl.fromTo("#g-stamp", { opacity: 0, scale: 1.35, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 3.0);
      tl.fromTo("#g-src", { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, 1.0);
      window.__timelines["golpe"] = tl;
    })();
