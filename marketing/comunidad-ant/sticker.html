<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; background: transparent; }
  #s { position: relative; width: 512px; height: 512px; }
  /* el "libro" del informe, inclinado, con borde blanco tipo sticker */
  .book { position: absolute; left: 96px; top: 34px; width: 318px; height: 430px; transform: rotate(-7deg);
    border-radius: 22px; border: 9px solid #fff; overflow: hidden;
    background:
      radial-gradient(260px 200px at 90% 0%, rgba(217,119,87,.30), transparent 70%),
      linear-gradient(170deg, #12244a 0%, #060d19 80%);
    box-shadow: 0 14px 30px rgba(0,0,0,.35); }
  .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: linear-gradient(90deg, #c9a24f, #f0dcaa); }
  .in { position: absolute; left: 40px; right: 24px; top: 30px; bottom: 26px; display: flex; flex-direction: column; }
  .k { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 17px; letter-spacing: .22em; color: #c9a24f; }
  .logos { display: flex; align-items: center; gap: 14px; margin-top: 26px; }
  .tile { width: 76px; height: 76px; border-radius: 18px; background: #fff; display: grid; place-items: center; }
  .tile img { width: 68px; height: 68px; }
  .spark { width: 56px; height: 56px; }
  .name { font-family: 'DM Serif Display', serif; font-size: 52px; line-height: 1; color: #f0dcaa; margin-top: 26px; }
  .tk { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 22px; color: #e9a189; margin-top: 10px; letter-spacing: .08em; }
  .bars { margin-top: auto; display: flex; align-items: flex-end; gap: 9px; height: 74px; }
  .bars i { display: block; width: 22px; border-radius: 4px 4px 2px 2px; background: #3a4a6b; }
  .bars i.h { background: linear-gradient(180deg, #f0dcaa, #c9a24f); }
  .k { display: flex; align-items: center; gap: 12px; }
  .m { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; letter-spacing: 0;
    background: linear-gradient(145deg, #f0dcaa, #c9a24f); color: #0b1730; font-family: 'DM Serif Display', serif; font-size: 23px; font-weight: 400; }
  /* cinta "NUEVO" */
  .tag { position: absolute; right: 30px; top: 40px; transform: rotate(9deg); padding: 10px 20px 11px; border-radius: 14px;
    background: #d97757; border: 6px solid #fff; box-shadow: 0 8px 18px rgba(0,0,0,.3);
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 25px; letter-spacing: .12em; color: #fff; }
</style>
</head>
<body>
<div id="s">
  <div class="book">
    <div class="spine"></div>
    <div class="in">
      <div class="k"><span class="m">M</span>INFORME</div>
      <div class="logos"><div class="tile"><img src="ant.png" alt="" /></div><img class="spark" src="claude.svg" alt="" /></div>
      <div class="name">Anthropic</div>
      <div class="tk">ANT · IPO</div>
      <div class="bars"><i style="height:8px"></i><i style="height:12px"></i><i style="height:18px"></i><i style="height:24px"></i><i style="height:36px"></i><i class="h" style="height:56px"></i><i class="h" style="height:74px"></i></div>
    </div>
  </div>
  <div class="tag">NUEVO</div>
</div>
</body>
</html>
