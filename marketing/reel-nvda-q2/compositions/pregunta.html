  <script>
    (function () {
      const MF = window.MF, { clamp, eOut4, eInOut3 } = MF;
      const R = document.querySelector('[data-composition-id="pregunta"]');

      // cierres reales NVDA 26-ago → 3-nov-2026
      const P = [209.66,227.98,217.55,220.78,217.44,224.41,228.45,230.36,225.73,223.67,218.36,218.29,210.96,212.17,213.9,219.34,222.27,227.38,228.87,225.51,224.58,225.07,228.86,227.21,228.38,230.86,233.95,238.9,239.24,237.47,230.48,229.28,226.32,228.52,221.3,217.23,214.13,217.09,216.47,221.97,212.21,210.96,216.0,217.94,215.38,213.66,204.64,202.06,206.69];
      const REF = 209.66, MAXI = 28, W = 940, H = 560, lo = 196, hi = 245;
      const X = (i) => (i / (P.length - 1)) * (W - 250);
      const Y = (p) => H - ((p - lo) / (hi - lo)) * H;
      const fmt = (v) => v.toFixed(2).replace(".", ",");
      const line = $("#q-line"), area = $("#q-area"), dot = $("#q-dot"), tag = $("#q-tag");

      $("#q-reflab").style.transform = `translate(0px, ${ry + 14}px)`;
      $("#q-maxlab").style.transform = `translate(${X(MAXI) - 150}px, ${Y(P[MAXI]) - 46}px)`;
      function drawChart(prog) {
        const n = Math.floor(prog), f = prog - n;
        let d = "", px = 0, py = 0;
        for (let i = 0; i <= n && i < P.length; i++) { px = X(i); py = Y(P[i]); d += (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1); }
        let price = P[Math.min(n, P.length - 1)];
        if (n < P.length - 1 && f > 0) { price = P[n] + (P[n + 1] - P[n]) * f; px = X(n + f); py = Y(price); d += "L" + px.toFixed(1) + " " + py.toFixed(1); }
        line.setAttribute("d", d);
        area.setAttribute("d", d + `L${px.toFixed(1)} ${H} L0 ${H} Z`);
        dot.setAttribute("cx", px); dot.setAttribute("cy", py);
        dot.setAttribute("fill", prog > MAXI ? "#EF4444" : "#10B981");
        tag.style.transform = `translate(${px + 22}px, ${py - 26}px)`;
        tag.textContent = "US$ " + fmt(price);
        tag.style.background = prog > P.length - 1.6 ? "#EF4444" : "#12233b";
        area.style.opacity = clamp((prog - MAXI) / 8, 0, 1);
      }
      const tl = gsap.timeline({ paused: true });
      MF.clock(tl, 4.4, (t) => {
        const u = clamp((t - 0.15) / 2.3, 0, 1);
        drawChart(Math.max(0.0001, (P.length - 1) * eInOut3(u)));
        $("#q-maxlab").style.opacity = clamp((t - 1.3) / 0.25, 0, 1);
