    (function () {
      const MF = window.MF, { clamp, eOut4, eInOut3 } = MF;
      const R = document.querySelector('[data-composition-id="golpe"]');
      const $ = (s) => R.querySelector(s);
      R.querySelectorAll("[data-n]").forEach((p) => (p.innerHTML = MF.N_SVG));
      // cierres reales NVDA 24-jul → 27-ago-2026
      const P = [206.84,196.51,197.01,190.01,195.04,200.75,206.64,211.94,219.22,218.99,223.96,217.55,217.5,224.09,225.3,225.16,225.01,219.74,217.56,216.85,214.72,208.48,213.05,209.66,227.98];
      const W = 940, H = 320, lo = 185, hi = 232;
      const X = (i) => (i / (P.length - 1)) * (W - 250);
      const Y = (p) => H - ((p - lo) / (hi - lo)) * H;
      const fmt = (v) => v.toFixed(2).replace(".", ",");
      const setNum = MF.odo($("#g-num"), ["+", 1, ",", 0.1, 0.01, "%"]);
      const line = $("#g-line"), area = $("#g-area"), dot = $("#g-dot"), tag = $("#g-tag");
      function drawChart(prog) {
        const n = Math.floor(prog), f = prog - n;
        let d = "", px = 0, py = 0;
        for (let i = 0; i <= n && i < P.length; i++) { px = X(i); py = Y(P[i]); d += (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1); }
        let price = P[Math.min(n, P.length - 1)];
        if (n < P.length - 1 && f > 0) { price = P[n] + (P[n + 1] - P[n]) * f; px = X(n + f); py = Y(price); d += "L" + px.toFixed(1) + " " + py.toFixed(1); }
        line.setAttribute("d", d);
        area.setAttribute("d", d + `L${px.toFixed(1)} ${H} L0 ${H} Z`);
        dot.setAttribute("cx", px); dot.setAttribute("cy", py);
        tag.style.transform = `translate(${px + 22}px, ${py - 26}px)`;
        tag.textContent = "US$ " + fmt(price);
        tag.style.background = prog > P.length - 1.6 ? "#10B981" : "#12233b";
        area.style.opacity = clamp((prog - (P.length - 2)) / 0.8, 0, 1);
      }
      const tl = gsap.timeline({ paused: true });
      MF.clock(tl, 3.8, (t) => {
        setNum(1.2 + (8.74 - 1.2) * eInOut3(clamp(t / 1.95, 0, 1)));
        const prog = t < 1.45 ? 6 + (P.length - 2 - 6) * eInOut3(clamp(t / 1.45, 0, 1)) : (P.length - 2) + eOut4(clamp((t - 1.45) / 0.45, 0, 1));
        drawChart(Math.min(prog, P.length - 1));
      });
      MF.karaoke(tl, R, "#g-h1", -0.04, 1.18, 0.26, true);
      MF.karaoke(tl, R, "#g-h2", 1.22, null, 0.32);
      tl.fromTo("#g-under", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 1.92);
      tl.fromTo("#g-num", { scale: 1 }, { scale: 1.08, duration: 0.08, ease: "power2.out" }, 1.9);
      tl.to("#g-num", { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.98);
      // el chip sube desde abajo y "despega": resplandor dorado + chispas

      tl.fromTo("#g-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 1.92);

      [["#g-k1", -190, -230], ["#g-k2", 170, -260], ["#g-k3", -260, -60], ["#g-k4", 250, -90], ["#g-k5", 10, -320]].forEach(([s, dx, dy], i) => {
        tl.fromTo(s, { opacity: 1, x: 0, y: 0, scale: 0.6 }, { x: dx, y: dy, scale: 1.1, duration: 0.45, ease: "power2.out", immediateRender: false }, 1.95 + i * 0.02);
        tl.to(s, { opacity: 0, duration: 0.3 }, 2.3 + i * 0.02);
      });
      tl.set(R.querySelectorAll(".spk"), { opacity: 0 }, 0);
      MF.flash(tl, "#g-flash", 1.92);
      MF.shake(tl, "#g-shake", 1.92, 10);
      tl.fromTo("#g-stamp", { opacity: 0, scale: 1.35, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 2.1);
      tl.fromTo("#g-src", { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, 2.4);
      window.__timelines["golpe"] = tl;
    })();
