<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Portada Reel Asesoría</title>
<link rel="stylesheet" href="fonts.css" />
<style>
/* Portada del Reel. Lo importante queda dentro del recorte 4:5 del perfil (y 285–1635). */
:root { --ink:#f3f6fb; --ch:#e9d3a0; --it:#f6e2b2; --navy:#0a0f1e; --navy2:#0f1a30; --navy3:#13213d; --line2:rgba(233,211,160,.28);
  --sans:'Instrument Sans',system-ui,sans-serif; --serif:'Newsreader',Georgia,serif; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--navy); }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; color:var(--ink); font-family:var(--sans);
  background:linear-gradient(180deg, var(--navy) 0%, var(--navy2) 55%, var(--navy3) 100%); -webkit-font-smoothing:antialiased; }
.halo { position:absolute; border-radius:50%; }
.halo--a { width:1400px; height:1400px; left:-480px; top:-300px; background:radial-gradient(closest-side, rgba(233,211,160,.12), transparent 70%); }
.halo--b { width:1300px; height:1300px; right:-600px; bottom:-300px; background:radial-gradient(closest-side, rgba(143,176,230,.08), rgba(233,211,160,.05) 45%, transparent 72%); }
.label { font:600 28px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--ch); }
.rule { display:flex; align-items:center; justify-content:center; gap:26px; }
.rule i { display:block; width:90px; height:1px; background:var(--line2); }
.top { position:absolute; top:360px; left:0; right:0; }
h1 { position:absolute; top:420px; left:0; right:0; text-align:center; font:500 176px/1 var(--serif); letter-spacing:-.015em; color:#fff; }
em { font-style:italic; color:var(--it); }
.who { position:absolute; left:50%; top:780px; width:600px; height:716px; margin-left:-300px; }
.who__light { position:absolute; inset:8% -4% 18%; border-radius:50%; background:radial-gradient(closest-side, rgba(233,211,160,.22), rgba(143,176,230,.08) 55%, transparent 75%); filter:blur(14px); }
.who__ring { position:absolute; left:5%; top:4%; width:90%; height:auto; }
.who__ring circle { fill:none; stroke:var(--line2); stroke-width:1.5; }
.who__img { position:absolute; inset:0 0 13%; display:flex; align-items:flex-end; justify-content:center;
  -webkit-mask-image:radial-gradient(115% 92% at 52% 30%, #000 62%, transparent 86%); mask-image:radial-gradient(115% 92% at 52% 30%, #000 62%, transparent 86%); }
.who__img img { width:100%; height:auto; display:block; filter:saturate(.92) contrast(1.03); }
.pill { position:absolute; left:50%; top:1480px; transform:translateX(-50%); display:flex; align-items:center; gap:20px; padding:22px 42px;
  border:1.5px solid #fbf7ee; border-radius:999px; background:#f4eee2; color:#0b1428; font:600 34px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; }
.pill i { width:12px; height:12px; border-radius:50%; background:#0b1428; }
</style>
</head>
<body>
<div id="stage">
  <div class="halo halo--a"></div>
  <div class="halo halo--b"></div>
  <div class="label rule top"><i></i>Manfredi Investment<i></i></div>
  <h1>Asesoría<br /><em>1 a 1</em></h1>
  <div class="who">
    <div class="who__light"></div>
    <svg class="who__ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="49.5" /></svg>
    <div class="who__img"><img src="assets/ignacio.webp" alt="" /></div>
  </div>
  <div class="pill"><i></i>Próximamente</div>
</div>
<script>window.seek = function () {}; window.DURATION = 0; window.READY = true;</script>
</body>
</html>
