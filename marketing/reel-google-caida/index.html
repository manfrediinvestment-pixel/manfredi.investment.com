<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #07101E; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #golpe { z-index: 3; } #ranking { z-index: 2; } #ventas { z-index: 1; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
      data-motion-blur-shutter="300"
    >
      <!-- Escena 1 (crema): el golpe. Sale por arriba a 2,96 s -->
      <div id="golpe" class="scene" data-composition-id="golpe" data-composition-src="compositions/golpe.html"
        data-start="0" data-duration="3.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- Escena 2 (navy): ranking + valor borrado. Entra de abajo a 2,96 s, sale a 6,96 s -->
      <div id="ranking" class="scene" data-composition-id="ranking" data-composition-src="compositions/ranking.html"
        data-start="2.96" data-duration="4.34" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- Escena 3 (crema): vendió 25% más… ¿entonces? -->
      <div id="ventas" class="scene" data-composition-id="ventas" data-composition-src="compositions/ventas.html"
        data-start="6.96" data-duration="3.04" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Transición "latigazo vertical" (referencia Portiv): toda la escena sube y la siguiente
      // entra pegada desde abajo, borde duro, ~0,3 s, lo más rápido en el medio.
      function whip(outSel, inSel, at) {
        tl.fromTo(outSel, { y: 0 }, { y: -1920, duration: 0.3, ease: "expo.inOut" }, at);
        tl.fromTo(inSel, { y: 1920 }, { y: 0, duration: 0.3, ease: "expo.inOut" }, at);
      }
      tl.set("#ranking", { y: 1920 }, 0);
      tl.set("#ventas", { y: 1920 }, 0);
      whip("#golpe", "#ranking", 2.96);
      whip("#ranking", "#ventas", 6.96);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
