<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <script src="assets/brand.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #060d1a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #golpe { z-index: 11; } #ranking { z-index: 10; } #ventas { z-index: 9; } #gasto { z-index: 8; } #panaderia { z-index: 7; } #ironia { z-index: 6; } #nube { z-index: 5; } #informe { z-index: 4; } #final { z-index: 3; } #comenta { z-index: 2; } #logo { z-index: 1; }
    </style>
  </head>
  <body>
    <!-- Generado por build_index.py: no editar a mano. Guion en GUION.md. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="70.6" data-width="1080" data-height="1920"
      data-motion-blur="on" data-motion-blur-shutter="300">
      <div id="golpe" class="scene" data-composition-id="golpe" data-composition-src="compositions/golpe.html"
        data-start="0" data-duration="3.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="ranking" class="scene" data-composition-id="ranking" data-composition-src="compositions/ranking.html"
        data-start="2.96" data-duration="4.34" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="ventas" class="scene" data-composition-id="ventas" data-composition-src="compositions/ventas.html"

      <div id="gasto" class="scene" data-composition-id="gasto" data-composition-src="compositions/gasto.html"

      <div id="panaderia" class="scene" data-composition-id="panaderia" data-composition-src="compositions/panaderia.html"
        data-start="19.76" data-duration="10.34" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="ironia" class="scene" data-composition-id="ironia" data-composition-src="compositions/ironia.html"
        data-start="29.76" data-duration="9.54" data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="nube" class="scene" data-composition-id="nube" data-composition-src="compositions/nube.html"

      <div id="informe" class="scene" data-composition-id="informe" data-composition-src="compositions/informe.html"

      <div id="final" class="scene" data-composition-id="final" data-composition-src="compositions/final.html"

      <div id="logo" class="scene" data-composition-id="logo" data-composition-src="compositions/logo.html"
        data-start="67.06" data-duration="3.54" data-track-index="11" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // latigazo vertical: toda la escena sube y la siguiente entra pegada desde abajo, borde duro
      function whip(outSel, inSel, at) {
        tl.fromTo(outSel, { y: 0 }, { y: -1920, duration: 0.3, ease: "expo.inOut" }, at);
        tl.fromTo(inSel, { y: 1920 }, { y: 0, duration: 0.3, ease: "expo.inOut" }, at);
      }
      tl.set("#ranking", { y: 1920 }, 0);
      tl.set("#ventas", { y: 1920 }, 0);
      tl.set("#gasto", { y: 1920 }, 0);
      tl.set("#panaderia", { y: 1920 }, 0);
      tl.set("#ironia", { y: 1920 }, 0);
      tl.set("#nube", { y: 1920 }, 0);
      tl.set("#informe", { y: 1920 }, 0);
      tl.set("#final", { y: 1920 }, 0);
      tl.set("#comenta", { y: 1920 }, 0);
      tl.set("#logo", { y: 1920 }, 0);
      whip("#golpe", "#ranking", 2.96);
      whip("#ranking", "#ventas", 6.96);
      whip("#ventas", "#gasto", 9.96);
      whip("#gasto", "#panaderia", 19.76);
      whip("#panaderia", "#ironia", 29.76);
      whip("#ironia", "#nube", 38.96);
      whip("#nube", "#informe", 44.46);
      whip("#informe", "#final", 52.46);
      whip("#final", "#comenta", 61.46);
      whip("#comenta", "#logo", 67.06);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
