name = "manfredi-mercados"
main = "index.js"
compatibility_date = "2026-04-19"

[vars]
SITE_URL = "https://manfredi-investment-com.pages.dev"

[[kv_namespaces]]
binding = "MERCADOS_KV"
id = "d5875fd93a4145c6af4703bd8ea309c8"

# Refresca los mega-caps de Acciones USA (ver refreshMegaCapPins en index.js)
# todos los lunes 8:00 AM ART (11:00 UTC), antes de que arranque la semana.
[triggers]
crons = ["0 11 * * MON"]

# Secrets (nunca en este archivo, configurar via wrangler):
#   wrangler secret put FINNHUB_KEY
#   wrangler secret put TWELVEDATA_KEY
